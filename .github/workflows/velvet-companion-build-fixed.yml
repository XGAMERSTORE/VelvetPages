name: Velvet Companion APK Fixed

on:
  push:
    branches: [ velvet-companion-build ]
    paths:
      - 'velvet-native/**'
      - '.github/workflows/velvet-companion-build-fixed.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: velvet-native
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VelvetCompanion3D-APK
          path: velvet-native/app/build/outputs/apk/debug/app-debug.apk
