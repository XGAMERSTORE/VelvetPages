name: Velvet Companion v0.3 APK

on:
  push:
    branches: [ velvet-companion-build ]
    paths:
      - 'velvet-v03/**'
      - '.github/workflows/velvet-companion-v03.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Bundle Three.js and CC0 rigged GLB model
        run: |
          set -euxo pipefail
          ASSETS=velvet-v03/app/src/main/assets
          mkdir -p "$ASSETS"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js' -o "$ASSETS/three.min.js"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js' -o "$ASSETS/GLTFLoader.js"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js' -o "$ASSETS/OrbitControls.js"
          curl -L --fail --retry 4 'https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb' -o "$ASSETS/human.glb"
          test -s "$ASSETS/three.min.js"
          test -s "$ASSETS/GLTFLoader.js"
          test -s "$ASSETS/OrbitControls.js"
          test -s "$ASSETS/human.glb"
          ls -lh "$ASSETS"

      - name: Apply WebView asset compatibility fixes
        run: |
          sed -i 's/let modelFacing=Math.PI/let modelFacing=0/' velvet-v03/app/src/main/assets/index.html
          sed -i '/s.setAllowFileAccess(true);/a\        s.setAllowFileAccessFromFileURLs(true);\n        s.setAllowUniversalAccessFromFileURLs(true);' velvet-v03/app/src/main/java/com/wildbond/velvetcompanion/v03/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: velvet-v03
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetCompanion-v0.3-APK
          path: velvet-v03/app/build/outputs/apk/debug/app-debug.apk
