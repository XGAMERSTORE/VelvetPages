name: Velvet Companion v0.4.2 APK

on:
  push:
    branches: [ velvet-companion-build ]
    paths:
      - 'velvet-v04/**'
      - '.github/workflows/velvet-companion-v04.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Bundle Three.js and Michelle female GLB
        run: |
          set -euxo pipefail
          ASSETS=velvet-v04/app/src/main/assets
          mkdir -p "$ASSETS"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js' -o "$ASSETS/three.min.js"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js' -o "$ASSETS/GLTFLoader.js"
          curl -L --fail --retry 4 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js' -o "$ASSETS/OrbitControls.js"
          curl -L --fail --retry 4 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb' -o "$ASSETS/Michelle.glb"
          test -s "$ASSETS/three.min.js"
          test -s "$ASSETS/GLTFLoader.js"
          test -s "$ASSETS/OrbitControls.js"
          test -s "$ASSETS/Michelle.glb"

      - name: Inject v0.4.2 runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('velvet-v04/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="fix-v041.js"></script>',
              '<script src="fix-v042.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          for tag in tags:
              assert tag in p.read_text(encoding='utf-8')
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: velvet-v04
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetCompanion-v0.4.2-APK
          path: velvet-v04/app/build/outputs/apk/debug/app-debug.apk
